name: PR Size Limit Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-pr-size:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Line Count
        uses: actions/github-script@v7
        with:
          script: |
            const MAX_LINES = 200;
            const additions = context.payload.pull_request.additions;
            const deletions = context.payload.pull_request.deletions;
            const totalChanges = additions + deletions;

            console.log(`Additions: ${additions}, Deletions: ${deletions}, Total changes: ${totalChanges}`);

            if (totalChanges > MAX_LINES) {
              core.setFailed(
                `PR exceeds the maximum allowed threshold of ${MAX_LINES} lines changed (Current: ${totalChanges}). Please break your changes into smaller pull requests.`
              );
            }
