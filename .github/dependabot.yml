version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The Vite toolchain (vite + vitest + @vitest/coverage-v8 +
      # @vitejs/plugin-react) must be bumped together — plugin-react 6.x and
      # vitest 4.x require Vite 8, while this repo is still on Vite 5. A
      # major bump on any one of these breaks `npm ci` / `vite build` (see
      # PR #58). Defer them until the deliberate Vite 5→8 migration pass.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
